<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta

    content="Calories Lab Case Study by Seif Zoghly — Social Media Specialist & Media Buyer."
  >

  <title>Calories Lab Case Study | Seif Zoghly</title>

  <!-- MAIN PORTFOLIO CSS -->
  <link rel="stylesheet" href="../style.css">


  <style>

    /* =========================================
       CALORIES LAB CASE STUDY
       ========================================= */

    :root {

      --cl-bg: #050505;
      --cl-surface: #0d0d0d;
      --cl-text: #f4f4f2;
      --cl-muted: #999999;

      --cl-orange: #ff5a00;

      /* Temporary Calories Lab accent colors */

      --cl-green: #94b989;
      --cl-green-light: #d8e6d0;

      --cl-line: rgba(255,255,255,.10);

    }


    body {

      background:

        radial-gradient(
          circle at 85% 10%,
          rgba(148,185,137,.10),
          transparent 25%
        ),

        radial-gradient(
          circle at 10% 60%,
          rgba(255,90,0,.06),
          transparent 25%
        ),

        var(--cl-bg);

      color: var(--cl-text);

    }


    .case-container {

      width:
        min(
          calc(100% - 48px),
          1240px
        );

      margin: 0 auto;

    }


    /* =========================================
       TOP NAV
       ========================================= */

    .case-nav {

      min-height: 78px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      border-bottom:
        1px solid var(--cl-line);

    }


    .case-nav a {

      font-family:
        "Barlow Condensed",
        sans-serif;

      font-weight: 700;

      font-size: .85rem;

      letter-spacing: .12em;

      text-transform: uppercase;

    }


    .back-projects {

      color: var(--cl-muted);

    }


    .back-projects:hover {

      color: var(--cl-text);

    }


    .contact-button {

      padding: 10px 18px;

      border:
        1px solid var(--cl-orange);

      color: var(--cl-orange);

    }


    /* =========================================
       HERO
       ========================================= */

    .case-hero {

      min-height:
        calc(100vh - 78px);

      display: grid;

      grid-template-columns:
        1.1fr .9fr;

      align-items: center;

      gap:
        clamp(
          40px,
          7vw,
          100px
        );

      padding:
        70px 0 85px;

    }


    .case-kicker {

      margin-bottom: 18px;

      color: var(--cl-green);

      font-family:
        "Barlow Condensed",
        sans-serif;

      font-size: .85rem;

      font-weight: 700;

      letter-spacing: .20em;

      text-transform: uppercase;

    }


    .case-hero h1 {

      max-width: 760px;

      font-family:
        "Barlow Condensed",
        sans-serif;

      font-size:
        clamp(
          4rem,
          8vw,
          7.2rem
        );

      font-weight: 700;

      line-height: .86;

      letter-spacing: -.025em;

      text-transform: uppercase;

    }


    .case-hero h1 span {

      display: block;

      color: transparent;

      -webkit-text-stroke:
        1.4px var(--cl-green);

    }


    .case-description {

      max-width: 690px;

      margin-top: 28px;

      color: var(--cl-muted);

      font-size: 1rem;

    }


    .role-badge {

      display: inline-block;

      margin-top: 25px;

      padding: 10px 15px;

      border:
        1px solid
        rgba(148,185,137,.35);

      background:
        rgba(148,185,137,.06);

      color:
        var(--cl-green-light);

      font-family:
        "Barlow Condensed",
        sans-serif;

      font-size: .82rem;

      font-weight: 700;

      letter-spacing: .10em;

      text-transform: uppercase;

    }


    /* =========================================
       HERO META
       ========================================= */

    .case-meta {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      margin-top: 38px;

      border-top:
        1px solid var(--cl-line);

      border-bottom:
        1px solid var(--cl-line);

    }


    .case-meta div {

      padding: 17px;

    }


    .case-meta div:first-child {

      padding-left: 0;

    }


    .case-meta div + div {

      border-left:
        1px solid var(--cl-line);

    }


    .case-meta strong {

      display: block;

      color:
        var(--cl-green-light);

      font-family:
        "Barlow Condensed",
        sans-serif;

      font-size: 1.25rem;

    }


    .case-meta span {

      display: block;

      margin-top: 3px;

      color: var(--cl-muted);

      font-size: .72rem;

      letter-spacing: .06em;

      text-transform: uppercase;

    }


    /* =========================================
       HERO VISUAL
       ========================================= */

    .case-visual {

      min-height: 520px;

      position: relative;

      display: flex;

      align-items: center;

      justify-content: center;

      border:
        1px solid var(--cl-line);

      background:

        linear-gradient(
          145deg,
          rgba(148,185,137,.08),
          rgba(255,90,0,.03)
        );

      overflow: hidden;

    }


    .calories-hero-image {

      width: 100%;

      height: 100%;

      min-height: 520px;

      object-fit: cover;

      display: block;

      position: relative;

      z-index: 2;

    }


    .case-visual::before {

      content: "CALORIES LAB";

      position: absolute;

      top: 28px;

      right: 28px;

      color:
        rgba(216,230,208,.12);

      font-family:
        "Barlow Condensed",
        sans-serif;

      font-size:
        clamp(
          3rem,
          6vw,
          5.5rem
        );

      font-weight: 800;

      line-height: .85;

      text-align: right;

      z-index: 1;

    }


    /* =========================================
       SECTIONS
       ========================================= */

    .case-section {

      padding: 95px 0;

      border-top:
        1px solid var(--cl-line);

    }


    .section-label {

      display: flex;

      align-items: center;

      gap: 14px;

      margin-bottom: 42px;

      font-family:
        "Barlow Condensed",
        sans-serif;

      font-size: .85rem;

      font-weight: 700;

      letter-spacing: .18em;

      text-transform: uppercase;

    }


    .section-label span {

      color: var(--cl-orange);

    }


    .section-label::after {

      content: "";

      width: 80px;

      height: 1px;

      background:
        rgba(255,90,0,.35);

    }


    .case-split {

      display: grid;

      grid-template-columns:
        1.05fr .95fr;

      gap: 70px;

    }


    .case-split h2 {

      font-family:
        "Barlow Condensed",
        sans-serif;

      font-size:
        clamp(
          3rem,
          5vw,
          5rem
        );

      font-weight: 600;

      line-height: .95;

      text-transform: uppercase;

      color: var(--cl-text);

    }


    .case-split > p,
    .body-copy {

      color: var(--cl-muted);

    }


    /* =========================================
       CARDS
       ========================================= */

    .cards-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 14px;

      margin-top: 40px;

    }


    .case-card {

      min-height: 190px;

      position: relative;

      padding: 24px;

      border:
        1px solid var(--cl-line);

      background: var(--cl-surface);
